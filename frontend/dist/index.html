<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>screenshot-go</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" crossorigin src="/assets/index-Bhh5b1cD.js"></script>
  </head>
  <body>
    <div id="app">
      <img id="shot" alt="" />
      <div id="overlay">
        <div id="dim-overlay" aria-hidden="true"></div>
        <div id="selection-box" aria-hidden="true">
          <canvas id="annotation-layer"></canvas>
          <canvas id="draft-layer"></canvas>
          <div id="text-editor-layer"></div>
          <div id="resize-handles" class="is-hidden" aria-hidden="true">
            <div class="resize-handle" data-handle="nw"></div>
            <div class="resize-handle" data-handle="n"></div>
            <div class="resize-handle" data-handle="ne"></div>
            <div class="resize-handle" data-handle="e"></div>
            <div class="resize-handle" data-handle="se"></div>
            <div class="resize-handle" data-handle="s"></div>
            <div class="resize-handle" data-handle="sw"></div>
            <div class="resize-handle" data-handle="w"></div>
          </div>
        </div>
        <div id="toolbar" hidden>
          <button type="button" data-tool="move" class="tool is-active" title="Move selection">Move</button>
          <button type="button" data-tool="rectangle" class="tool" title="Rectangle">Rect</button>
          <button type="button" data-tool="ellipse" class="tool" title="Ellipse">Circle</button>
          <button type="button" data-tool="arrow" class="tool" title="Arrow">Arrow</button>
          <button type="button" data-tool="text" class="tool" title="Text">Text</button>
          <input id="color-picker" type="color" value="#ffffff" title="Annotation color" />
          <button type="button" data-action="copy" class="action" title="Copy PNG">Copy</button>
          <button type="button" data-action="save" class="action" title="Save PNG">Save</button>
          <button type="button" data-action="cancel" class="action action-cancel" title="Cancel">Close</button>
        </div>
        <div id="hint">Drag to select an area. Press Escape to cancel.</div>
        <div id="status" hidden></div>
      </div>
    </div>
  </body>
  </html>
