version: "3"

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: screenshot-go
  BIN_DIR: ./bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Build the current platform binary
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Alias to build for this repo's minimal packaging setup
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Run the built binary for the current platform
    cmds:
      - task: "{{OS}}:run"
