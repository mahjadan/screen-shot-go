name: Release

# Builds and publishes installable packages whenever a version tag (e.g. v0.2.0) is pushed.
# macOS and Linux each require their own native toolchain (Cocoa vs GTK/WebKitGTK via CGO),
# so they build on separate runners and are attached to one GitHub Release at the end.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  WAILS3_VERSION: v3.0.0-alpha.72
  GO_VERSION: "1.27"
  NODE_VERSION: "20"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Sync build metadata to tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/version: \".*\"/version: \"$VERSION\"/" build/config.yml && rm build/config.yml.bak
          wails3 task common:update:build-assets

      - name: Build and package .app bundle
        run: wails3 task darwin:package

      - name: Zip the .app bundle
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent screenshot-go.app "screenshot-go-${GITHUB_REF_NAME}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: bin/*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2t64 || \
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Sync build metadata to tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/version: \".*\"/version: \"$VERSION\"/" build/config.yml && rm build/config.yml.bak
          sed -i.bak "s/version: \".*\"/version: \"$VERSION\"/" build/linux/nfpm/nfpm.yaml && rm build/linux/nfpm/nfpm.yaml.bak
          wails3 task common:update:build-assets

      - name: Build AppImage and .deb package
        run: |
          wails3 task linux:create:appimage
          wails3 task linux:create:deb

      - name: Rename artifacts with version
        run: |
          cd bin
          for f in *.AppImage; do mv "$f" "screenshot-go-${GITHUB_REF_NAME}-linux-amd64.AppImage"; done
          for f in *.deb; do mv "$f" "screenshot-go-${GITHUB_REF_NAME}-linux-amd64.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            bin/*.AppImage
            bin/*.deb
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-build/*.zip
            dist/linux-build/*.AppImage
            dist/linux-build/*.deb
          generate_release_notes: true
